    app.kubernetes.io/name: serverless-kube-watch-trigger
  name: pi-agent-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pi-agent-worker
subjects:
- kind: ServiceAccount
  name: pi-agent-worker
  namespace: ($namespace)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: serverless-kube-watch-trigger
  name: (join('-', ['pi-agent-worker-discovery', $namespace]))
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: (join('-', ['pi-agent-worker-discovery', $namespace]))
subjects:
- kind: ServiceAccount
  name: pi-agent-worker
