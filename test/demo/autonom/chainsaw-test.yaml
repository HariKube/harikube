apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: configmap-prompt-pitrigger
spec:
  skipDelete: true
  namespace: default
  timeouts:
    apply: 10m
    assert: 2m
    exec: 10m
  steps:
  - name: Create pi-agent-config secret
    try:
    - script:
        content: |
          kubectl create secret generic -n default pi-agent-config \
            --from-file=$HOME/.pi/agent/auth.json \
            --from-file=$HOME/.pi/agent/models-store.json \
            --from-file=models.json=/dev/null \
            --from-file=$HOME/.pi/agent/settings.json \
            --dry-run=client -o yaml | kubectl apply -f -
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: pi-agent-config
            namespace: default
  - name: Apply bootstrap resources and PiTrigger
    try:
    - apply:
        file: rbac.yaml
    - apply:
        file: trigger.yaml
  - name: Wait until PiTrigger is in Running phase
    try:
    - assert:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: PiTrigger
          metadata:
            name: worker-agent
            namespace: default
          status:
            phase: Running
  - name: Send the ConfigMap after PiTrigger is running
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: todo-prompt
            labels:
              operation: building
          data:
            01-step: "Design a custom resource for todo application `todos.todo.harikube.info`, and make it available on cluster via `exec_kubectl`"
            02-step: "Validate todo custom resource is available at the cluster via `kubernetes-service-discovery-runtime` - otherwise ensure it is available"
            03-step: "Use `kubernetes-service-discovery-runtime` skill to fetch available cluster services, and look for todo, and create a sample todo item"
            04-step: "Validate todo item is exists"
    - sleep:
        duration: 10m
    - assert:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: todo-prompt
            namespace: default
            labels:
              operation: builded
    - assert:
        resource:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: todos.todo.harikube.info
