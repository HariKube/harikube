apiVersion: v1
kind: ServiceAccount
metadata:
  name: pi-trigger-runner
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pi-trigger-runner-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "delete"]

  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["update"]

  - apiGroups: ["triggers.harikube.info"]
    resources: ["pitriggers"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pi-trigger-runner-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: pi-trigger-runner
    namespace: default
roleRef:
  kind: Role
  name: pi-trigger-runner-role
  apiGroup: rbac.authorization.k8s.io
